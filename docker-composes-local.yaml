name: achemed-local

services:
  app:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: achemed-local-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: >
      sh -c "php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - achemed-local

  queue:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: achemed-local-queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    networks:
      - achemed-local

  scheduler:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: achemed-local-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    command: php artisan schedule:work
    networks:
      - achemed-local

  vite:
    image: node:22-alpine
    container_name: achemed-local-vite
    profiles:
      - assets
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host=0.0.0.0"
    networks:
      - achemed-local

networks:
  achemed-local:
    driver: bridge
